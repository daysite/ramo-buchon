<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo Buchón 💛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #fff8dc, #ffe680 55%, #f2c200);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }

  .stage {
    position: relative;
    width: 480px;
    height: 640px;
  }

  .title {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-style: italic;
    color: #7a5c00;
    font-size: 1.15rem;
    z-index: 20;
  }

  /* ====== RAMO ====== */
  .bouquet {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    height: 520px;
  }

  /* Tallos: todos nacen del punto de amarre */
  .stems {
    position: absolute;
    bottom: 130px;                 /* punto de amarre */
    left: 50%;
    width: 0; height: 0;
    z-index: 1;
  }
  .stem {
    position: absolute;
    bottom: 0;
    left: -3px;
    width: 6px;
    height: 230px;
    background: linear-gradient(90deg, #2f5f1f, #4d8b2c, #2f5f1f);
    border-radius: 3px;
    transform-origin: bottom center;
  }

  /* Cabeza del ramo: domo donde van las flores */
  .head {
    position: absolute;
    bottom: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 260px;
    z-index: 5;
  }

  .flower {
    position: absolute;
    transform-origin: center;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-4px) rotate(2deg); }
  }

  .petal {
    position: absolute;
    left: 50%; top: 50%;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow: inset -2px -2px 5px rgba(0,0,0,.12),
                inset 2px 2px 4px rgba(255,255,255,.5);
  }
  .core {
    position: absolute;
    left: 50%; top: 50%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8a5a1a, #4a2c00 70%);
    box-shadow: inset 0 0 6px rgba(0,0,0,.6);
    transform: translate(-50%,-50%);
  }

  /* Colores */
  .f-yellow .petal { background: radial-gradient(circle at 30% 30%, #fff0a1, #f9c400); }
  .f-orange .petal { background: radial-gradient(circle at 30% 30%, #ffe08a, #ff9d1c); }
  .f-white  .petal { background: radial-gradient(circle at 30% 30%, #ffffff, #f1e6a6); }

  /* ====== PAPEL QUE ENVUELVE ====== */
  .wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    z-index: 10;
  }
  /* Capa trasera */
  .wrap .back {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fffbe6, #ffd93b);
    clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    border-radius: 0 0 30% 30% / 0 0 20% 20%;
    box-shadow: 0 18px 35px rgba(0,0,0,.18);
  }
  /* Capa frontal (delantera) */
  .wrap .front {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fffef7, #ffe98a);
    clip-path: polygon(30% 10%, 70% 10%, 100% 100%, 0% 100%);
    border-radius: 0 0 35% 35% / 0 0 22% 22%;
    opacity: .95;
  }

  /* ====== LAZO ====== */
  .ribbon {
    position: absolute;
    bottom: 265px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 30px;
    background: linear-gradient(180deg, #f5c400, #d9a300);
    border-radius: 6px;
    z-index: 15;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
  }
  .ribbon::before,
  .ribbon::after {
    content: "";
    position: absolute;
    top: -18px;
    width: 55px;
    height: 55px;
    background: linear-gradient(160deg, #ffe066, #e6b800);
    border-radius: 60% 60% 40% 40% / 70% 70% 30% 30%;
    box-shadow: 0 4px 8px rgba(0,0,0,.15);
  }
  .ribbon::before { left: -38px; transform: rotate(-25deg); }
  .ribbon::after  { right: -38px; transform: rotate(25deg) scaleX(-1); }
</style>
</head>
<body>

<div class="stage">
  <p class="title">Un ramo buchón de flores amarillas para ti 💛</p>

  <div class="bouquet">
    <!-- Tallos desde un solo punto -->
    <div class="stems">
      <div class="stem" style="transform: rotate(-24deg); height:250px;"></div>
      <div class="stem" style="transform: rotate(-14deg); height:250px;"></div>
      <div class="stem" style="transform: rotate(-5deg);  height:250px;"></div>
      <div class="stem" style="transform: rotate(5deg);   height:250px;"></div>
      <div class="stem" style="transform: rotate(14deg);  height:250px;"></div>
      <div class="stem" style="transform: rotate(24deg);  height:250px;"></div>
    </div>

    <!-- Flores apiñadas formando un domo -->
    <div class="head" id="head"></div>

    <!-- Papel + lazo -->
    <div class="wrap">
      <div class="back"></div>
      <div class="front"></div>
    </div>
    <div class="ribbon"></div>
  </div>
</div>

<script>
  // Posiciones calculadas para formar un DOMO (arco) apiñado
  // x, y relativos a .head (320x260). Más cerca del centro = más arriba.
  const flowers = [
    // fila superior (puntas del domo)
    { x: 140, y: 0,   s: 90, c: 'f-yellow' },
    // segunda fila
    { x: 70,  y: 30,  s: 90, c: 'f-orange' },
    { x: 150, y: 25,  s: 100,c: 'f-yellow' },
    { x: 215, y: 30,  s: 90, c: 'f-white'  },
    // tercera fila (más ancha)
    { x: 15,  y: 75,  s: 95, c: 'f-yellow' },
    { x: 95,  y: 70,  s: 105,c: 'f-orange' },
    { x: 175, y: 70,  s: 105,c: 'f-yellow' },
    { x: 245, y: 75,  s: 95, c: 'f-white'  },
    // fila inferior (base del domo, tapa el punto de amarre)
    { x: 40,  y: 130, s: 100,c: 'f-orange' },
    { x: 120, y: 135, s: 110,c: 'f-yellow' },
    { x: 200, y: 130, s: 100,c: 'f-orange' },
    // rellenos pequeños
    { x: 165, y: 105, s: 85, c: 'f-white'  },
  ];

  const head = document.getElementById('head');

  flowers.forEach((f, i) => {
    const flower = document.createElement('div');
    flower.className = 'flower ' + f.c;
    flower.style.left = f.x + 'px';
    flower.style.top = f.y + 'px';
    flower.style.width = f.s + 'px';
    flower.style.height = f.s + 'px';
    flower.style.animationDelay = (i * 0.25) + 's';
    flower.style.zIndex = 100 - i; // las de arriba se ven encima

    const petalCount = 8;
    const petalW = f.s * 0.42;
    const petalH = f.s * 0.50;
    const radius = f.s * 0.22;

    for (let j = 0; j < petalCount; j++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      const angle = (360 / petalCount) * j;
      petal.style.width = petalW + 'px';
      petal.style.height = petalH + 'px';
      petal.style.marginLeft = -(petalW / 2) + 'px';
      petal.style.marginTop = -(petalH / 2) + 'px';
      petal.style.transform =
        `translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}px)`;
      flower.appendChild(petal);
    }

    const core = document.createElement('div');
    core.className = 'core';
    core.style.width = (f.s * 0.34) + 'px';
    core.style.height = (f.s * 0.34) + 'px';
    flower.appendChild(core);

    head.appendChild(flower);
  });
</script>
</body>
</html>
