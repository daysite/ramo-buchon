<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo Buchón 💛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }

  body {
    background: radial-gradient(circle at 50% 40%, #fff8dc, #ffe680 55%, #f2c200);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ====== PÉTALOS CAYENDO ====== */
  .petals-fall {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 30;
  }
  .falling {
    position: absolute;
    top: -60px;
    width: 18px;
    height: 22px;
    background: radial-gradient(circle at 30% 30%, #fff0a1, #f9c400);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: .85;
    box-shadow: inset -1px -1px 3px rgba(0,0,0,.1);
    animation: fall linear infinite;
  }
  .falling.orange { background: radial-gradient(circle at 30% 30%, #ffe08a, #ff9d1c); }
  .falling.white  { background: radial-gradient(circle at 30% 30%, #ffffff, #f1e6a6); }

  @keyframes fall {
    0% {
      transform: translateY(-60px) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: .9; }
    100% {
      transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(720deg);
      opacity: 0;
    }
  }

  /* ====== ESCENARIO ====== */
  .stage {
    position: relative;
    width: 480px;
    height: 640px;
  }

  .stage::before {
    content: "";
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, rgba(255,255,255,.65), transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .stage::after {
    content: "";
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 30px;
    background: radial-gradient(ellipse, rgba(90,60,0,.45), transparent 70%);
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: -10px;
    width: 100%;
    text-align: center;
    font-style: italic;
    color: #7a5c00;
    font-size: 1.15rem;
    z-index: 20;
    text-shadow: 0 1px 2px rgba(255,255,255,.6);
  }

  /* ====== RAMO ====== */
  .bouquet {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    height: 520px;
    z-index: 10;
    animation: floatBouquet 6s ease-in-out infinite;
  }
  @keyframes floatBouquet {
    0%,100% { transform: translateX(-50%) translateY(0) rotate(-.4deg); }
    50%     { transform: translateX(-50%) translateY(-6px) rotate(.4deg); }
  }

  /* Tallos */
  .stems {
    position: absolute;
    bottom: 130px;
    left: 50%;
    width: 0; height: 0;
    z-index: 1;
  }
  .stem {
    position: absolute;
    bottom: 0;
    left: -3px;
    width: 6px;
    height: 230px;
    background: linear-gradient(90deg, #2f5f1f, #4d8b2c, #2f5f1f);
    border-radius: 3px;
    transform-origin: bottom center;
  }

  /* Cabeza del ramo */
  .head {
    position: absolute;
    bottom: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 260px;
    z-index: 5;
  }

  .flower {
    position: absolute;
    width: 0;
    height: 0;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-4px) rotate(2deg); }
  }

  .petal {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow: inset -2px -2px 5px rgba(0,0,0,.12),
                inset 2px 2px 4px rgba(255,255,255,.5);
    transform-origin: center center;
  }

  .core {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, #b07a2a 0%, #8a5a1a 45%, #5c3a0a 100%),
      radial-gradient(circle, rgba(0,0,0,.18) 1px, transparent 1.6px);
    background-size: 100% 100%, 6px 6px;
    background-position: 0 0, 0 0;
    box-shadow:
      inset 0 0 4px rgba(0,0,0,.35),
      inset 0 -3px 6px rgba(0,0,0,.25),
      0 0 6px rgba(120,80,0,.25);
    transform: translate(-50%,-50%);
  }

  .f-yellow .petal { background: radial-gradient(circle at 30% 30%, #fff0a1, #f9c400); }
  .f-orange .petal { background: radial-gradient(circle at 30% 30%, #ffe08a, #ff9d1c); }
  .f-white  .petal { background: radial-gradient(circle at 30% 30%, #ffffff, #f1e6a6); }

  /* ====== PAPEL MEJORADO ====== */
  .wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    z-index: 10;
    filter: drop-shadow(0 20px 25px rgba(90,60,0,.35));
  }
  /* Capa trasera: kraft dorado más oscuro */
  .wrap .back {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #e8b800 0%, #c98f00 60%, #a86f00 100%);
    clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    border-radius: 0 0 30% 30% / 0 0 20% 20%;
  }
  /* Capa frontal: amarillo cálido con pliegue */
  .wrap .front {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.10) 0%,
        rgba(0,0,0,0) 12%,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0) 88%,
        rgba(0,0,0,.10) 100%),
      linear-gradient(160deg, #fff3b8 0%, #ffd93b 45%, #f0b900 100%);
    clip-path: polygon(30% 10%, 70% 10%, 100% 100%, 0% 100%);
    border-radius: 0 0 35% 35% / 0 0 22% 22%;
    box-shadow:
      inset 8px 0 12px -8px rgba(0,0,0,.25),
      inset -8px 0 12px -8px rgba(0,0,0,.25),
      inset 0 -10px 18px -6px rgba(120,80,0,.25);
  }
  /* Pliegue central */
  .wrap .front::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 10%;
    transform: translateX(-50%);
    width: 40%;
    height: 90%;
    background: linear-gradient(180deg,
      rgba(255,255,255,.35),
      rgba(255,255,255,.0) 60%);
    border-radius: 50% 50% 40% 40% / 20% 20% 80% 80%;
    pointer-events: none;
  }
  /* Borde dorado fino */
  .wrap .border {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #d4a300 0%, #a87400 100%);
    clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    border-radius: 0 0 30% 30% / 0 0 20% 20%;
    z-index: -1;
    transform: scale(1.02);
    transform-origin: bottom center;
  }

  /* Lazo */
  .ribbon {
    position: absolute;
    bottom: 265px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 30px;
    background: linear-gradient(180deg, #ffd11a, #d9a300);
    border-radius: 6px;
    z-index: 15;
    box-shadow: 0 4px 8px rgba(120,80,0,.45);
  }
  .ribbon::before,
  .ribbon::after {
    content: "";
    position: absolute;
    top: -18px;
    width: 55px;
    height: 55px;
    background: linear-gradient(160deg, #ffe066, #e6b800);
    border-radius: 60% 60% 40% 40% / 70% 70% 30% 30%;
    box-shadow: 0 4px 8px rgba(120,80,0,.35);
  }
  .ribbon::before { left: -38px; transform: rotate(-25deg); }
  .ribbon::after  { right: -38px; transform: rotate(25deg) scaleX(-1); }
  .ribbon .knot {
    position: absolute;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    background: radial-gradient(circle at 35% 35%, #ffe066, #c99500);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: inset -1px -1px 3px rgba(0,0,0,.35);
  }
</style>
</head>
<body>

<div class="petals-fall" id="petalsFall"></div>

<div class="stage">
  <p class="title">Un ramo buchón de flores amarillas para ti 💛</p>

  <div class="bouquet">
    <div class="stems">
      <div class="stem" style="transform: rotate(-24deg); height:250px;"></div>
      <div class="stem" style="transform: rotate(-14deg); height:250px;"></div>
      <div class="stem" style="transform: rotate(-5deg);  height:250px;"></div>
      <div class="stem" style="transform: rotate(5deg);   height:250px;"></div>
      <div class="stem" style="transform: rotate(14deg);  height:250px;"></div>
      <div class="stem" style="transform: rotate(24deg);  height:250px;"></div>
    </div>

    <div class="head" id="head"></div>

    <div class="wrap">
      <div class="border"></div>
      <div class="back"></div>
      <div class="front"></div>
    </div>
    <div class="ribbon"><div class="knot"></div></div>
  </div>
</div>

<script>
  const flowers = [
    { x: 160, y: 45,  s: 90,  c: 'f-yellow' },
    { x: 100, y: 75,  s: 90,  c: 'f-orange' },
    { x: 175, y: 70,  s: 100, c: 'f-yellow' },
    { x: 240, y: 75,  s: 90,  c: 'f-white'  },
    { x: 45,  y: 120, s: 95,  c: 'f-yellow' },
    { x: 120, y: 115, s: 105, c: 'f-orange' },
    { x: 195, y: 115, s: 105, c: 'f-yellow' },
    { x: 270, y: 120, s: 95,  c: 'f-white'  },
    { x: 75,  y: 180, s: 100, c: 'f-orange' },
    { x: 155, y: 185, s: 110, c: 'f-yellow' },
    { x: 235, y: 180, s: 100, c: 'f-orange' },
    { x: 175, y: 150, s: 85,  c: 'f-white'  },
  ];

  const head = document.getElementById('head');

  flowers.forEach((f, i) => {
    const flower = document.createElement('div');
    flower.className = 'flower ' + f.c;
    flower.style.left = f.x + 'px';
    flower.style.top  = f.y + 'px';
    flower.style.animationDelay = (i * 0.25) + 's';
    flower.style.zIndex = 100 - i;

    const petalCount = 8;
    const petalW = f.s * 0.42;
    const petalH = f.s * 0.50;
    const radius = f.s * 0.26;

    for (let j = 0; j < petalCount; j++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      const angle = (360 / petalCount) * j;
      petal.style.width  = petalW + 'px';
      petal.style.height = petalH + 'px';
      petal.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
      flower.appendChild(petal);
    }

    const core = document.createElement('div');
    core.className = 'core';
    core.style.width  = (f.s * 0.34) + 'px';
    core.style.height = (f.s * 0.34) + 'px';
    core.style.transform = 'translate(-50%, -50%)';
    flower.appendChild(core);

    head.appendChild(flower);
  });

  /* Pétalos cayendo */
  const fallBox = document.getElementById('petalsFall');
  const tones = ['', 'orange', 'white', 'orange', '', 'white'];
  const TOTAL = 22;

  for (let i = 0; i < TOTAL; i++) {
    const p = document.createElement('div');
    p.className = 'falling ' + tones[i % tones.length];
    const size = 10 + Math.random() * 16;
    p.style.width  = size + 'px';
    p.style.height = (size * 1.2) + 'px';
    p.style.left   = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay    = (Math.random() * 8) + 's';
    p.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    p.style.opacity = 0.5 + Math.random() * 0.5;
    fallBox.appendChild(p);
  }
</script>
</body>
</html>
